<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>Promemo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="lock" class="lock" hidden></div>
  <div class="app">
    <aside class="sidebar">
      <div class="titlebar-drag">
        <div class="traffic">
          <button class="tl tl-close" data-win="close" title="Chiudi"></button>
          <button class="tl tl-min" data-win="minimize" title="Riduci"></button>
          <button class="tl tl-max" data-win="maximize" title="Ingrandisci"></button>
        </div>
      </div>
      <div class="brand">
        <img src="../build/icon.png" alt="" class="brand-icon">
        <span>Promemo</span>
      </div>
      <div class="side-scroll">
      <nav class="nav" id="nav"></nav>
      <div class="side-mini" id="side-mini" hidden></div>
      <div class="side-section">
        <div class="side-label">Raccolte</div>
        <div id="side-cats"></div>
      </div>
      <div class="side-section">
        <div class="side-label side-label-row">Calendari<button class="side-add" data-action="nav" data-view="account" title="Collega un account"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg></button></div>
        <div id="side-cals"></div>
      </div>
      </div>
      <div class="side-bottom">
        <button class="side-btn" id="btn-settings">
          <svg viewBox="0 0 24 24"><use href="#i-gear"/></svg> Impostazioni
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="toolbar-title" id="toolbar-title"></div>
        <div class="toolbar-actions">
          <label class="search">
            <svg viewBox="0 0 24 24"><use href="#i-search"/></svg>
            <input id="global-search" placeholder="Cerca" spellcheck="false"><kbd class="kbd-hint" data-action="palette" title="Palette comandi">Ctrl K</kbd>
          </label>
          <button class="icon-btn sync-btn" id="btn-sync" hidden><svg viewBox="0 0 24 24"><use href="#i-sync"/></svg></button>
          <button class="btn-primary" id="btn-new">
            <svg viewBox="0 0 24 24"><use href="#i-plus"/></svg> Nuovo
          </button>
        </div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div class="popover-layer" id="popover-layer"></div>
  <div class="toast" id="toast"></div>

  <!-- Icone (stile SF Symbols, tratto 1.75) -->
  <svg class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6h-6v6H4.5a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 16.5h.01M12 16.5h.01" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>

      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4.5 3.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>

      <symbol id="i-step" viewBox="0 0 24 24"><path d="M12 21v-7M12 14 6 4M12 14l6-10"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4.5" rx="1"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5M10 12.5h4"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>

      <!-- icone raccolte -->
      <symbol id="c-plane" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></symbol>
      <symbol id="c-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/><path d="M10 21v-5h4v5"/></symbol>

      <symbol id="c-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 12.5h18"/></symbol>
      <symbol id="c-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></symbol>
      <symbol id="c-dumbbell" viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></symbol>

  <script src="app.js"></script>
</body>
</html>
