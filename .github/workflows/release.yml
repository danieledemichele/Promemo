name: Release

# Costruisce i pacchetti e li allega alla release quando si crea un tag vX.Y.Z
# (o a mano da Actions → Release → Run workflow, indicando il tag).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release (es. v1.12.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Crea la release se non esiste (con le note in docs/note/TAG.md)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/note/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # rilancio a mano: il tag segue l'ultimo commit e le note si aggiornano
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              git tag -f "$TAG" "${{ github.sha }}" && git push -f origin "refs/tags/$TAG"
              [ -f "$NOTES" ] && gh release edit "$TAG" --notes-file "$NOTES" --title "Promemo ${TAG#v}"
            fi
            exit 0
          fi
          if [ -f "$NOTES" ]; then gh release create "$TAG" --target "${{ github.sha }}" --title "Promemo ${TAG#v}" --notes-file "$NOTES"
          else gh release create "$TAG" --target "${{ github.sha }}" --title "Promemo ${TAG#v}" --generate-notes; fi

  desktop:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: AppImage e .deb
        run: npx electron-builder --linux AppImage deb --publish never
      - name: Allega alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.AppImage dist/*.deb --clobber

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: C'è l'app Android?
        id: has
        run: test -d mobile-app && echo "yes=1" >> "$GITHUB_OUTPUT" || echo "yes=0" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.has.outputs.yes == '1'
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        if: steps.has.outputs.yes == '1'
        with:
          distribution: temurin
          java-version: 21
      - name: Prepara il web e Capacitor
        if: steps.has.outputs.yes == '1'
        working-directory: mobile-app
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Versione dell'app dal tag
        if: steps.has.outputs.yes == '1'
        run: |
          VER="${TAG#v}"; IFS=. read -r MA MI PA <<< "$VER"
          CODE=$((MA*10000 + MI*100 + ${PA:-0}))
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \".*\"/versionName \"$VER\"/" mobile-app/android/app/build.gradle
          grep -n "version" mobile-app/android/app/build.gradle
      - name: Chiave di firma
        if: steps.has.outputs.yes == '1'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > mobile-app/android/app/promemo.jks; fi
      - name: APK
        if: steps.has.outputs.yes == '1'
        working-directory: mobile-app/android
        env:
          PROMEMO_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease 2>&1 | tee ../../gradle.log || { echo "::error::$(grep -iE 'error|what went wrong|failed' -A4 ../../gradle.log | tail -c 3500 | tr '\n' ' ')"; exit 1; }
          VER="${TAG#v}"
          # senza la chiave nei segreti l'APK è firmato con una chiave temporanea: lo segnalo nel nome
          if [ -f app/promemo.jks ]; then cp app/build/outputs/apk/release/app-release.apk "../../Promemo-$VER.apk"; else cp app/build/outputs/apk/release/app-release.apk "../../Promemo-$VER-provvisoria.apk"; fi
      - name: Allega alla release
        if: steps.has.outputs.yes == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Promemo-*.apk --clobber
