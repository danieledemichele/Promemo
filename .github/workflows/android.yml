name: Android (prova)

# Verifica che l'app Android si costruisca a ogni modifica; l'APK resta tra gli artefatti dell'esecuzione.
on:
  push:
    branches: [main]
    paths: ['mobile-app/**', 'src/nlp.js', 'src/recur.js', 'src/syncmodel.js']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web e Capacitor
        working-directory: mobile-app
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: promemo-apk
          path: mobile-app/android/app/build/outputs/apk/release/*.apk
