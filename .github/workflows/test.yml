name: Test

# test di sicurezza e di funzionamento a ogni modifica (senza Electron e senza rete)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - name: Dipendenze senza vulnerabilità note
        run: npm audit --omit=dev --audit-level=high
